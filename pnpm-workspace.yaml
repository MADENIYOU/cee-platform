allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
# Pas un vrai monorepo — ce fichier n'existe que pour la config pnpm
# (depuis pnpm 10+, certains réglages comme onlyBuiltDependencies ne sont
# lus qu'ici, plus dans package.json ni .npmrc).

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - unrs-resolver

# deepmerge-ts : @prisma/config (dépendance transitive de @prisma/client,
# donc dans l'arbre de prod) épingle 7.1.5, vulnérable à un épuisement de
# pile (GHSA-ggr8-5vv4-36mx). Forcé vers la version corrigée.
overrides:
  deepmerge-ts: ">=8.0.0"
